name: Facebook comment bot
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fb-comment-bot
  cancel-in-progress: false
jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fb-comment-bot.mjs
        env:
          FB_PAGE_ID: "1281181228407541"
          OTHER_MAX_AGE_HOURS: "24"
          MAX_REPLIES: "20"
          MAX_OTHER: "10"
          FB_SYSTEM_TOKEN: ${{ secrets.FB_SYSTEM_TOKEN }}
          DRY_RUN: ${{ vars.FB_BOT_LIVE == 'true' && 'false' || 'true' }}
