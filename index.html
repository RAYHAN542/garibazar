    <style>
      /* Static splash shown instantly before JS loads/parses/runs.
         React replaces this the moment it mounts. */
      .gb-splash {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        background: #f8fafc;
      }
      .gb-splash-header {
        height: 56px;
        display: flex;
        align-items: center;
        padding: 0 16px;
        border-bottom: 1px solid #e2e8f0;
        font-weight: 700;
        color: #f59e0b;
        font-size: 18px;
      }
      .gb-splash-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        padding: 12px;
      }
      .gb-skel {
        border-radius: 16px;
        overflow: hidden;
        background: #ffffff;
        border: 1px solid #e2e8f0;
      }
      .gb-skel-img {
        width: 100%;
        aspect-ratio: 4 / 3;
        background: #e2e8f0;
        animation: gb-pulse 1.4s ease-in-out infinite;
      }
      .gb-skel-lines {
        padding: 10px;
      }
      .gb-skel-line {
        height: 10px;
        border-radius: 6px;
        background: #e2e8f0;
        margin-bottom: 8px;
        animation: gb-pulse 1.4s ease-in-out infinite;
      }
      @keyframes gb-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
    </style>
  </head>
